# Guide §1.4 checkpoint registry. One entry per checkpoint, filled in by hand and verified
# against the model card - epochs / pretrain_images_m / registers feed Section 11's confound
# regression directly, so a wrong or missing value there is a wrong regression input, not just
# bookkeeping.
#
# Status: Sets A-F and the medical extension are researched below, each against its official
# repo/model card via live search, not from memory. Two groups are NOT yet in this file at all:
# positive controls (LaSt-ViT - a CVPR 2026 paper, plus test-time-register variants of OpenCLIP
# and DINOv2) and BiomedCLIP's official card (only found an unofficial fine-tune so far, not the
# real microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224 release) - both need a dedicated
# follow-up pass rather than being guessed at here.

# ---------------------------------------------------------------------------------------- Set A
# ImageNet-1K, architecture (ViT-S/16, ViT-B/16) and data held fixed. Isolates: objective.
- id: dino_vits16
  source: timm/vit_small_patch16_224.dino
  objective: self_distillation
  arch: ViT-S/16
  params_m: 21.7
  depth: 12
  pretrain_data: IN1k
  pretrain_images_m: 1.28
  epochs: 800
  registers: 0
  native_res: 224
  license: Apache-2.0
  set: A
  # this row is the guide's own worked example, verbatim from the PDF

- id: deit3_small_patch16_224
  source: timm/deit3_small_patch16_224
  objective: label_supervised
  arch: ViT-S/16
  params_m: 22.1
  pretrain_data: IN1k
  pretrain_images_m: 1.28
  registers: 0
  native_res: 224
  license: Apache-2.0  # inferred from the facebookresearch/deit lineage's usual license, not an explicit line quoted for DeiT-III itself
  set: A
  verify: true  # epochs specifically: DeiT-III's IN-1K "from scratch" recipe epoch count not pinned down yet

- id: ibot_vits16
  source: github.com/bytedance/ibot
  objective: self_distillation  # MIM (masked image modeling) + DINO-style CLS self-distillation
  arch: ViT-S/16
  params_m: 21
  pretrain_data: IN1k
  pretrain_images_m: 1.28
  epochs: 800
  registers: 0
  native_res: 224
  set: A
  verify: true  # license not confirmed (no explicit LICENSE text found; ByteDance academic repos are often Apache-2.0 but not checked here)

- id: mocov3_vits
  source: github.com/facebookresearch/moco-v3
  objective: contrastive
  arch: ViT-S/16  # repo calls it "ViT-Small"; same architecture
  params_m: 22
  pretrain_data: IN1k
  pretrain_images_m: 1.28
  epochs: 300
  registers: 0
  native_res: 224
  license: CC-BY-NC-4.0  # confirmed directly in the repo's README
  set: A

- id: mae_vitb16
  source: github.com/facebookresearch/mae
  objective: reconstruction
  arch: ViT-B/16
  params_m: 86
  pretrain_data: IN1k
  pretrain_images_m: 1.28
  epochs: 1600  # the norm_pix_loss variant, Table 3 in the paper - the one the repo actually releases
  registers: 0
  native_res: 224
  license: CC-BY-NC-4.0  # confirmed directly in the repo's README ("This project is under the CC-BY-NC 4.0 license")
  set: A

- id: tscam_deits
  source: github.com/vasgaowei/TS-CAM
  objective: label_supervised  # WSOL head on a DeiT-S backbone; the 2021 anchor per the proposal
  arch: DeiT-S (ViT-S/16)
  pretrain_data: IN1k
  pretrain_images_m: 1.28
  registers: 0
  native_res: 224
  license: Apache-2.0  # confirmed directly on the repo page
  set: A
  verify: true  # params_m / epochs not pinned down yet (backbone is DeiT-S's own pretraining, not a separate TS-CAM-specific pretrain)

