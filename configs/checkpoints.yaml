# -------------------------------------------------------------------------------- Positive controls
# Known shortcut-suppression mechanisms, used to validate that the metrics detect a known effect.
- id: lastvit_dino
  source: github.com/ChengShiest/LAST-ViT  # proposal calls it "LaSt-ViT"; official repo name is "LAST-ViT" - same paper
  objective: self_distillation
  arch: "ViT (exact size not confirmed - trained via the facebookresearch/dino script)"
  set: positive_control
  verify: true  # params/epochs/license not pinned down; paper is "Vision Transformers Need More Than Registers," Shi et al., CVPR 2026, arXiv 2602.22394

- id: lastvit_clip
  source: github.com/ChengShiest/LAST-ViT
  objective: image_text_contrastive
  arch: "ViT (exact size not confirmed - trained via the mlfoundations/open_clip script)"
  set: positive_control
  verify: true  # same paper as lastvit_dino; params/epochs/license not pinned down

- id: lastvit_labelsup
  source: github.com/ChengShiest/LAST-ViT
  objective: label_supervised
  arch: ViT-B/16
  set: positive_control
  verify: true  # same paper as lastvit_dino; epochs/license not pinned down

- id: dinov2_vitl14_ttreg
  source: github.com/nickjiang2378/test-time-registers
  objective: self_distillation
  arch: ViT-L/14
  params_m: 304.4
  pretrain_data: LVD-142M
  pretrain_images_m: 142
  registers: 0  # not trained with registers - test-time registers are a forward-hook edit, not added tokens; see the adapter note below
  native_res: 518
  set: positive_control
  verify: true  # license not pinned down; NeurIPS 2025 Spotlight, "Vision Transformers Don't Need Trained Registers" (Jiang, Dravid, Efros, Gandelsman, arXiv 2506.08010) - needs its own adapter note since the mechanism is a live hook on register NEURONS, not a token-layout change

- id: open_clip_ttreg
  source: github.com/nickjiang2378/test-time-registers
  objective: image_text_contrastive
  arch: "ViT (exact size not confirmed - released as precomputed HF models)"
  set: positive_control
  verify: true  # same paper as dinov2_vitl14_ttreg; exact base architecture/size and license not pinned down

